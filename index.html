  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaXxCode - Interactive JavaScript Mastery</title>
    <meta name="description" content="A playful, Duolingo-style coding platform dedicated exclusively to JavaScript, featuring interactive lessons, advanced async and algorithmic concepts, live execution sandbox, and arcade games." />
    <meta property="og:title" content="MaXxCode - Interactive JavaScript Mastery" />
    <meta property="og:description" content="Master modern JavaScript through gamified lessons, interactive challenges, live sandbox, and arcade games." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary: #F59E0B;
        --color-secondary: #10B981;
        --color-accent: #EC4899;
        --color-bg: #F8FAFC;
        --color-card: #FFFFFF;
        --color-text: #0F172A;
        --color-sidebar: #FFFFFF;
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Nunito', sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text);
        transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s ease;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      
      /* Smooth Scrolling and Elasticity */
      .custom-scrollbar {
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }

      /* Pattern Utilities */
      .bg-pattern-dots {
        background-image: radial-gradient(#000000 1px, transparent 1px);
        background-size: 20px 20px;
        opacity: 0.05;
      }
      .bg-pattern-grid {
        background-image: linear-gradient(#000000 1px, transparent 1px), linear-gradient(90deg, #000000 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.03;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-primary);
        border-radius: 10px;
        opacity: 0.5;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-text);
      }
      
      /* Code Editor Syntax Highlighting Mock */
      .token.keyword { color: #d73a49; font-weight: bold; }
      .token.string { color: #032f62; }
      .token.function { color: #6f42c1; }
      .token.number { color: #005cc5; }
      
      /* Animations */
      @keyframes pop {
        0% { transform: scale(0.95); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop {
        animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      
      @keyframes slideUp {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-up {
        animation: slideUp 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }
      
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .animate-shimmer {
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }
    </style>
